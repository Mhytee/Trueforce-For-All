name: Publish guides

# Publishes guides/ as a site, so a guide can be linked from a forum reply or a
# Discord answer without sending someone into a GitHub folder listing. Only that
# folder is published: the rest of the repository, including docs/, is not.
#
# The guides carry no YAML front matter and link to each other as plain .md
# files. Both are fine, because GitHub Pages enables jekyll-optional-front-matter
# (renders a bare .md), jekyll-relative-links (rewrites a .md link to its page)
# and jekyll-readme-index (serves README.md as the front page) by default.

on:
  push:
    branches: [main]
    paths:
      - 'guides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./guides
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
