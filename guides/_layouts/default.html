<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="site">
  <a class="brand" href="{{ '/' | relative_url }}">TF4ALL <span>guides</span></a>
  <nav>
    <a href="https://github.com/Mhytee/Trueforce-For-All/releases">Download</a>
    <a href="https://discord.gg/sfwsDqTsdn">Discord</a>
    <a href="https://github.com/Mhytee/Trueforce-For-All">GitHub</a>
  </nav>
</header>

<main>
  {{ content }}
  {% unless page.url == '/' %}
  <p class="back"><a href="{{ '/' | relative_url }}">All guides</a></p>
  {% endunless %}
</main>

<footer>
  These are generated from the plugin's own copies, so they never drift from
  what you see in the app.
</footer>

</body>
</html>
